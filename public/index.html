<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cc-dash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23d97757'/><path d='M4 5l3 3-3 3M8 11h4' stroke='white' stroke-width='1.6' fill='none'/></svg>">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Texts are filled in from i18n.js (data-i18n*). -->
  <div id="app">
    <aside id="sidebar">
      <header class="side-head">
        <span class="brand">cc-dash</span>
        <button id="new-btn" class="btn primary" data-i18n="side.newBtn" data-i18n-title="side.newBtnTitle"></button>
      </header>
      <div class="filter-row">
        <input id="filter" class="filter" type="search" data-i18n-placeholder="side.filter" autocomplete="off">
        <button id="group-btn" class="btn small"></button>
      </div>
      <nav id="session-list"></nav>
      <footer id="side-foot"></footer>
    </aside>

    <main id="main">
      <header id="main-head" hidden>
        <div class="head-info">
          <div id="head-title" class="head-title"></div>
          <div id="head-meta" class="head-meta"></div>
        </div>
        <div class="head-actions">
          <button id="panel-btn" class="btn" data-i18n="head.panel" data-i18n-title="head.panelTitle"></button>
        </div>
      </header>
      <div id="workspace">
        <section id="term-area">
          <div id="empty" class="empty">
            <h2 data-i18n="empty.title"></h2>
            <p data-i18n-html="empty.body"></p>
          </div>
          <div id="detail" class="detail" hidden></div>
          <div id="terms"></div>
          <div id="term-search" class="term-search" hidden>
            <input id="search-input" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false">
            <span id="search-count" class="search-count"></span>
            <button id="search-prev" class="btn small" data-i18n-title="search.prev">↑</button>
            <button id="search-next" class="btn small" data-i18n-title="search.next">↓</button>
            <button id="search-close" class="btn small" data-i18n-title="search.close">×</button>
          </div>
        </section>
        <div id="splitter" hidden></div>
        <section id="panel" hidden>
          <div class="tabs" role="tablist">
            <button class="tab" data-tab="diff" data-i18n="tab.diff"></button>
            <button class="tab" data-tab="files" data-i18n="tab.files"></button>
            <button class="tab" data-tab="refs" data-i18n="tab.refs" data-i18n-title="tab.refsTitle"></button>
            <span class="spacer"></span>
            <button id="panel-refresh" class="btn small" data-i18n-title="panel.refresh">↻</button>
          </div>
          <div id="panel-body"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="item-menu" class="menu" role="menu" hidden></div>

  <dialog id="new-dialog">
    <form method="dialog" id="new-form">
      <h3 data-i18n="new.title"></h3>
      <label for="new-profile" data-i18n="new.profile"></label>
      <select id="new-profile" data-i18n-title="new.profileTitle"></select>
      <label for="new-cwd" data-i18n="new.folder"></label>
      <input id="new-cwd" required autocomplete="off" spellcheck="false" data-i18n-placeholder="new.folderPlaceholder">
      <div class="recent-label" data-i18n="new.recent"></div>
      <div id="recent-dirs" class="recent-dirs"></div>
      <p id="new-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn" value="cancel" id="new-cancel" data-i18n="new.cancel"></button>
        <button type="submit" class="btn primary" value="ok" data-i18n="new.start"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
